# Standard label taxonomy. Synced via reusable workflow.

- name: size/XS
  color: c2e0ff
  description: 1-10 lines changed
- name: size/S
  color: 85c1ff
  description: 11-50 lines changed
- name: size/M
  color: 4a90d9
  description: 51-250 lines changed
- name: size/L
  color: 2563a0
  description: 251-999 lines changed
- name: size/XL
  color: 0e3d6b
  description: 1000+ lines changed
- name: risk/low
  color: 2da44e
  description: Bugbot risk assessment -- low
- name: risk/medium
  color: d29922
  description: Bugbot risk assessment -- medium
- name: risk/high
  color: cf222e
  description: Bugbot risk assessment -- high
- name: review/urgent
  color: e01e5a
  description: Needs same-day review (author-declared)
- name: status/stale
  color: 8b949e
  description: No activity for 14+ days (auto-applied)
- name: complexity/high
  color: 8957e5
  description: Non-obvious logic, careful review (author-declared)
- name: domain/scanning
  color: 0d9488
  description: PR touches code owned by Scanning
- name: domain/findings
  color: 14b8a6
  description: PR touches code owned by Findings
- name: domain/integrations
  color: 2dd4bf
  description: PR touches code owned by Integrations
- name: domain/platform
  color: 5eead4
  description: PR touches code owned by Platform
- name: domain/frontend
  color: 99f6e4
  description: PR touches code owned by Frontend
- name: domain/infra
  color: 0f766e
  description: PR touches code owned by Infra
- name: domain/database
  color: 115e59
  description: PR touches code owned by Database
# The two labels below are applied by the shared Renovate preset
# (renovate-config.json), not by the pr-labeler, and both predate this file.
#
# Dependabot created `dependencies` per-repo before the Renovate migration, so
# repos that never ran Dependabot have it in GitHub's default gray instead.
# Listed here to settle on one color; the blue is Dependabot's own, kept
# because most repos already show it.
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file
# `security` comes from the preset's vulnerabilityAlerts block, so it is only
# created once a repo's first vulnerability-remediation PR applies it. Repos
# with no manifest in a GitHub Advisory Database ecosystem (the Terraform and
# deployment repos) never get one and so never had the label. Listed here so it
# exists everywhere up front rather than appearing mid-incident. Color and text
# are Dependabot's upstream defaults, matching `dependencies` above; every repo
# here shows GitHub's default gray only because Renovate, not Dependabot,
# created the label. Close to risk/high's cf222e, but these never co-occur:
# risk/* is Bugbot's assessment of a human PR, security is on bot PRs only.
- name: security
  color: ee0701
  description: Pull requests that address a security vulnerability
